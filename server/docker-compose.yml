name: devdigest2

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devdigest2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devdigest2
      POSTGRES_PASSWORD: devdigest2
      POSTGRES_DB: devdigest2
    ports:
      - "5432:5432"
    volumes:
      - devdigest_pgdata2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdigest2 -d devdigest2"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devdigest_pgdata2:
    name: devdigest_pgdata2
